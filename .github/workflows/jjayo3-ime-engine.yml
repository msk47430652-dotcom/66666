name: Build JJayo3 Working Name Input Engine
on:
  push:
    branches: [jjayo3-s26-build-20261028]
    paths: ['scripts/jjayo_ime_core_v4.py','.github/workflows/jjayo3-ime-engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Clone verified WIPI Android source
        run: |
          git clone https://github.com/ParkJeongseop/WIPI-Emulator.git upstream
          git -C upstream checkout ca199cc2e8c8f9d7569a2232bc48f48e94593af5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Linux dependency for headless test
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev pkg-config
      - name: Resolve locked Rust source
        working-directory: upstream/rust
        run: cargo fetch --locked
      - name: Add exact reproduced fixes and KTF name keyboard
        run: |
          python3 scripts/jjayo_fix_clip.py
          python3 scripts/jjayo_graphics_clip_v3.py
          python3 scripts/jjayo_ime_core_v4.py upstream
      - name: Compile Linux game + Korean typing regression runner
        working-directory: upstream/rust
        run: cargo build --locked --release -p wipi_android --bin headless
      - name: Prepare Android NDK 27.1 ARM64 linker
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.1.12297006'
          C="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android26-clang"\nrustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]\n[env]\nCC_aarch64_linux_android = "%s/aarch64-linux-android26-clang"\nAR_aarch64_linux_android = "%s/llvm-ar"\n' "$C" "$C" "$C" > upstream/rust/.cargo/config.toml
      - name: Build S26 ARM64 JNI engine
        working-directory: upstream/rust
        run: cargo build --locked --release --target aarch64-linux-android -p wipi_android
      - name: Verify build outputs
        run: |
          test -s upstream/rust/target/release/headless
          test -s upstream/rust/target/aarch64-linux-android/release/libwipi_android.so
          file upstream/rust/target/aarch64-linux-android/release/libwipi_android.so
      - uses: actions/upload-artifact@v4
        with:
          name: jjayo3-ime-core-v4-linux-arm64
          path: |
            upstream/rust/target/release/headless
            upstream/rust/target/aarch64-linux-android/release/libwipi_android.so
          if-no-files-found: error
